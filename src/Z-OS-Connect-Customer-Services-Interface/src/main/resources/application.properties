server.port=19080
server.servlet.context-path=/customerservices-1.0
# Security fix (V6 CWE-942 permissive CORS): explicit CORS origin allowlist (no wildcard). Set to the SPA origin per environment.
cbsa.security.cors.allowed-origins=http://localhost:3000
# Security fix (V4 CWE-209 Sensitive Data Exposure): never expose stack traces or exception messages in HTTP error responses.
server.error.include-stacktrace=never
server.error.include-message=never
# Security fix (F-001 / V2 CWE-306 Missing Authentication, CWE-862 Missing Authorization - OWASP A01/A07;
# V7 CWE-798 Hardcoded Credentials - OWASP A05): externalized TELLER role credentials that back the
# @PreAuthorize("hasRole('TELLER')") guards on the state-changing endpoints. The username is non-sensitive
# (default "teller"); the password MUST be supplied at deploy time via the CBSA_TELLER_PASSWORD environment
# variable. NO secret is committed here - a blank password means no teller is registered and access stays
# denied by default until a credential is provisioned (mirrors the Liberty externalized-registry pattern).
cbsa.security.teller.username=${CBSA_TELLER_USERNAME:teller}
cbsa.security.teller.password=${CBSA_TELLER_PASSWORD:}
