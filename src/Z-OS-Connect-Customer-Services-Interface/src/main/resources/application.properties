# ---------------------------------------------------------------------------
# Backend re-point note (DOCUMENTATION / ALIGNMENT ONLY - NOT a live property)
# ---------------------------------------------------------------------------
# Banking business logic now lives in the new standalone Spring Boot module
# `bank-core`, which reproduces the frozen z/OS Connect REST contract (F-019)
# verbatim at the ROOT context (server.port=8080, no context-path). This UI
# module reaches that backend through ConnectionInfo.getAddressAndPort().
#
# IMPORTANT: ConnectionInfo resolves the backend host/port from JVM SYSTEM
# PROPERTIES via System.getProperty(...), NOT from this Spring
# application.properties file. The entries below are therefore documentation
# only; override the ConnectionInfo defaults with -D JVM flags or a Blitzy
# secret if needed.
#
#   CBSA_ZOSCONN_HOST=localhost   (bank-core host; ConnectionInfo default = localhost)
#   CBSA_ZOSCONN_PORT=8080        (bank-core port; ConnectionInfo default = 8080)
#   => backend base URL: http://localhost:8080
# ---------------------------------------------------------------------------
