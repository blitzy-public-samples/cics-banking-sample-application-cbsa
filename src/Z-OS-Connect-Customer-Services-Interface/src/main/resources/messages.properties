# Security fix (V4 Sensitive Data Exposure - CWE-209 Generation of Error Message Containing
# Sensitive Information; OWASP A09 Security Logging and Monitoring Failures, A02): override
# Spring's DEFAULT data-binding "typeMismatch" message. When a user submits a non-numeric
# value for a numeric-typed form field (e.g. the account "overdraftLimit" int or "interestRate"
# float on Create Account, or the "acctNumber" int on Update Account), Spring's data binder
# records a "typeMismatch" field error whose default text discloses internal Java type names
# (for example "Failed to convert property value of type 'java.lang.String' to required type
# 'int'"). That text is rendered verbatim by the Thymeleaf th:errors tag, leaking implementation
# detail to the client. These messages are resolved by the Spring MessageSource (Spring Boot
# auto-configures it with the "messages" basename), which substitutes a generic, sanitized
# message instead. Binding-time conversion errors populate the BindingResult rather than being
# thrown, so the centralized @ControllerAdvice GlobalExceptionHandler never sees them - this
# MessageSource override is the correct, minimal, config-only remediation.
#
# Resolution order (most specific wins): typeMismatch.<object>.<field> > typeMismatch.<field>
# > typeMismatch.<type> > typeMismatch. The catch-all guarantees no default message can leak.

# Most specific: Create Account numeric fields (POST /createacc).
typeMismatch.createAccountForm.overdraftLimit=Please enter a whole number for the overdraft limit.
typeMismatch.createAccountForm.interestRate=Please enter a valid interest rate.

# Most specific: Update Account numeric field (POST /updateacc).
typeMismatch.updateAccountForm.acctNumber=Please enter a valid account number.

# Field-level fallbacks (any command object exposing these fields).
typeMismatch.overdraftLimit=Please enter a whole number for the overdraft limit.
typeMismatch.interestRate=Please enter a valid interest rate.
typeMismatch.acctNumber=Please enter a valid account number.

# Type-level fallbacks for numeric conversions across this module's forms.
typeMismatch.java.lang.Integer=Please enter a whole number.
typeMismatch.int=Please enter a whole number.
typeMismatch.java.lang.Float=Please enter a valid number.
typeMismatch.float=Please enter a valid number.

# Catch-all: any remaining type-conversion failure yields a generic, non-revealing message.
typeMismatch=Invalid input; please check your entry and try again.

# Security fix (V4 Sensitive Data Exposure - CWE-209 Generation of Error Message Containing
# Sensitive Information; OWASP A09, A02): override Spring's DEFAULT data-binding "methodInvocation"
# message. This is a DISTINCT leak mechanism from "typeMismatch" above. When a form field is
# declared as a String but its SETTER eagerly converts the value (e.g. UpdateAccountForm's
# setAcctOverdraft calls Integer.parseInt on the "Overdraft Limit" field), submitting a non-numeric
# value makes the setter THROW during data binding. Spring's binder records a "methodInvocation"
# field error whose DEFAULT text embeds the raw exception - e.g. 'Property acctOverdraft threw
# exception: java.lang.NumberFormatException: For input string: "abc"' - which the Thymeleaf
# th:errors tag then renders verbatim, disclosing the internal class name (CWE-209). Exactly like
# typeMismatch, this binding error POPULATES the BindingResult (it is NOT re-thrown), so the
# centralized @ControllerAdvice GlobalExceptionHandler never sees it; this MessageSource override
# is the correct, minimal, config-only remediation. (By contrast, the lazy getAcctInterestRateFloat/
# getAcctOverdraftInt parses run later during UpdateAccountJson construction and DO propagate, so
# they are already sanitized by handleUnexpectedException -> generic 500.)
#
# Resolution order (most specific wins): methodInvocation.<object>.<field> > methodInvocation.<field>
# > methodInvocation.<type> > methodInvocation. The catch-all guarantees no raw exception text leaks.

# Most specific: Update Account overdraft field (POST /updateacc); its String setter parses to int.
methodInvocation.updateAccountForm.acctOverdraft=Please enter a whole number for the overdraft limit.

# Field-level fallback (any command object exposing an "acctOverdraft" field).
methodInvocation.acctOverdraft=Please enter a whole number for the overdraft limit.

# Catch-all: any remaining setter-thrown binding failure yields a generic, non-revealing message.
methodInvocation=Invalid input; please check your entry and try again.
