# Security fix (V4 Sensitive Data Exposure - CWE-209 Generation of Error Message Containing
# Sensitive Information; OWASP A09 Security Logging and Monitoring Failures, A02): override
# Spring's DEFAULT data-binding "typeMismatch" message. When a user submits a non-numeric
# value for a numeric-typed form field (e.g. the payment "amount" Float), Spring's data binder
# records a "typeMismatch" field error whose default text discloses internal Java type names
# (for example "Failed to convert property value of type 'java.lang.String' to required type
# 'java.lang.Float'"). That text is rendered verbatim by the Thymeleaf th:errors tag, leaking
# implementation detail to the client. These messages are resolved by the Spring MessageSource
# (Spring Boot auto-configures it with the "messages" basename), which substitutes a generic,
# sanitized message instead. Binding-time conversion errors populate the BindingResult rather
# than being thrown, so the centralized @ControllerAdvice GlobalExceptionHandler never sees
# them - this MessageSource override is the correct, minimal, config-only remediation.
#
# Resolution order (most specific wins): typeMismatch.<object>.<field> > typeMismatch.<field>
# > typeMismatch.<type> > typeMismatch. The catch-all guarantees no default message can leak.

# Most specific: the payment TransferForm amount field (POST /paydbcr).
typeMismatch.transferForm.amount=Please enter a valid numeric amount.

# Field-level fallback (any command object exposing an "amount" field).
typeMismatch.amount=Please enter a valid numeric amount.

# Type-level fallbacks for numeric conversions across this module's forms.
typeMismatch.java.lang.Float=Please enter a valid number.
typeMismatch.float=Please enter a valid number.

# Catch-all: any remaining type-conversion failure yields a generic, non-revealing message.
typeMismatch=Invalid input; please check your entry and try again.

# Security fix (V4 Sensitive Data Exposure - CWE-209; OWASP A09, A02 - defense-in-depth): also
# override Spring's DEFAULT data-binding "methodInvocation" message. That error code arises when a
# form field's SETTER throws during binding (e.g. a String setter that eagerly parses to a number);
# its default text embeds the raw exception - including an internal class name such as
# java.lang.NumberFormatException - which th:errors would render verbatim (CWE-209). This module's
# TransferForm setters do NOT parse eagerly today (a non-numeric amount produces a "typeMismatch"
# on the Float, handled above), so no "methodInvocation" error arises currently; this catch-all is
# a zero-risk, config-only guard that keeps Payment consistent with Customer Services and closes the
# systemic CWE-209 vector by construction should any setter ever throw during binding.
methodInvocation=Invalid input; please check your entry and try again.
